[project]
name = "singapore-customs"
version = "1.0.0"
description = "Extract Singapore merchandise trade (value and quantity) by HS code, partner and trade type from SingStat TableBuilder."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no copyright header in this repo
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D100", "D103", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
